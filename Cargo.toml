[package]
name = "ruppa"
version = "1.4.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
flate2 = "1.1.11"
portable-pty = "0.9.0"
regex = "1.13.1"
self-replace = "1.5.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
ureq = "3.5.2"
vt100 = "0.18.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
